# ==============================================================================
# Configuración Nginx para CleanMail (cleanmail.uno.my) y Landing (unio.my)
# Guardar en: /etc/nginx/sites-available/cleanmail.conf
# Enlazar en: sudo ln -s /etc/nginx/sites-available/cleanmail.conf /etc/nginx/sites-enabled/
# Probar con: sudo nginx -t && sudo systemctl reload nginx
# Certificados SSL con Certbot: sudo certbot --nginx -d cleanmail.uno.my -d unio.my -d www.unio.my
# ==============================================================================

# 1. Configuración para la Plataforma CleanMail (cleanmail.uno.my)
server {
    listen 80;
    listen [::]:80;
    server_name cleanmail.uno.my;

    # Límite de carga para archivos CSV y Excel de bases de datos grandes
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# 2. Configuración para la Landing Page Pública (unio.my y www.unio.my)
server {
    listen 80;
    listen [::]:80;
    server_name unio.my www.unio.my;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
